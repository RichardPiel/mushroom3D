# Ne pas utiliser ce fichier dans Dokploy.
# Dokploy : compose à la racine du dépôt → ../docker-compose.yml
# (sinon Dokploy traite ce chemin comme un dossier et échoue sur .env)
services:
  incubator:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      UI_PORT: "8765"
      INCUBATOR_PASSWORD: ${INCUBATOR_PASSWORD}
      RELAY_TOKEN: ${RELAY_TOKEN}
      CAMERA_URL: ${CAMERA_URL:-}
    volumes:
      - incubator_data:/data
    expose:
      - "8765"

volumes:
  incubator_data:
