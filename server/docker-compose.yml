# Variante locale (build depuis ce dossier). Sur Dokploy, préférer le compose à la racine.
services:
  incubator:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      UI_PORT: "8765"
      INCUBATOR_PASSWORD: ${INCUBATOR_PASSWORD}
      RELAY_TOKEN: ${RELAY_TOKEN}
      CAMERA_URL: ${CAMERA_URL:-}
    volumes:
      - incubator_data:/data
    expose:
      - "8765"

volumes:
  incubator_data:
